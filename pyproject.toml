[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paari"
version = "0.1.0"
description = "Paari: a policy-governed LLM/agent platform for agentic commerce."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paari" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5.0",
    "structlog>=24",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "mcp>=1.0,<2.0",
    "razorpay>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["paari"]

[tool.hatch.build.targets.wheel.force-include]
"paari/governance/data/paari_governance.json" = "paari/governance/data/paari_governance.json"
"paari/governance/data/paari_policy.json" = "paari/governance/data/paari_policy.json"
"paari/governance/data/merchant_demo.json" = "paari/governance/data/merchant_demo.json"
"paari/governance/data/store_demo.json" = "paari/governance/data/store_demo.json"
"paari/tools/fixtures/catalog.json" = "paari/tools/fixtures/catalog.json"
"paari/tools/fixtures/store_policies.json" = "paari/tools/fixtures/store_policies.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: live Razorpay API tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.mypy-pydantic]
strict = true